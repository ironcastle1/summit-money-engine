name: Deploy MERLIN Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static dashboard
        env:
          MERLIN_API_BASE_URL: ${{ vars.MERLIN_API_BASE_URL }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/
          printf 'window.MERLIN_CONFIG = { API_BASE: "%s" };\n' "$MERLIN_API_BASE_URL" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
