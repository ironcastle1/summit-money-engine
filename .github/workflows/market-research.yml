name: MERLIN Market Research

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Research focus
        required: false
        default: current product opportunities suitable for the present CNC setup
  schedule:
    - cron: '17 5 * * *'

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger evidence research
        env:
          BACKEND: ${{ secrets.MERLIN_BACKEND_URL }}
          TOKEN: ${{ secrets.MERLIN_AUTOMATION_TOKEN }}
          FOCUS: ${{ inputs.focus || 'current product opportunities suitable for the present CNC setup' }}
        run: |
          test -n "$BACKEND"
          test -n "$TOKEN"
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({'focus': os.environ['FOCUS']}))
          PY
          )
          curl --fail --show-error --silent \
            -X POST "$BACKEND/api/market/research" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload"
