name: Merlin verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Environment validation
        run: npm run validate:env
      - name: Foundation checks
        run: npm run test:part01
      - name: Part 01 manifest and syntax verification
        run: npm run verify:part01
      - name: Environment and security verification
        run: npm run security:scan
      - name: Source line audit
        run: npm run lines
