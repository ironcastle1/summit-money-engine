<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summit Security Companion v7</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/panels.css">
</head>
<body>
  <header id="topbar">
    <div class="brand-dot" title="live"><span class="pulse"></span></div>
    <div id="ticker">loading live security console...</div>
    <div class="lang">LANG
      <select id="languageSelect">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="uk">Українська</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
        <option value="fa">فارسی</option>
        <option value="tr">Türkçe</option>
      </select>
    </div>
  </header>
  <nav id="tabs">
    <input id="searchBox" data-i18n-placeholder="searchPlaceholder" placeholder="Search street, area, town or city">
    <label class="mini-field"><span data-i18n="radius">Radius</span><input id="radiusMiles" type="number" min="0.5" max="50" step="0.5" value="5"></label>
    <select id="scanFilter" class="scan-filter">
      <option value="all">All signals</option>
      <option value="security">Security only</option>
      <option value="crisis">Crisis only</option>
      <option value="movement">Movement only</option>
      <option value="money">Money only</option>
    </select>
    <button id="searchBtn" class="scan-action">SCAN</button>
    <button data-tab="ops">OPS</button>
    <button data-tab="live">LIVE BRIEF</button>
    <button data-tab="route">ROUTE</button>
    <button data-tab="watch">WATCH</button>
    <button data-tab="offline">OFFLINE PACK</button>
    <button data-tab="threats">THREATS</button>
    <button data-tab="crisis">CRISIS</button>
    <button data-tab="sources">SOURCES</button>
  </nav>
  <main id="app">
    <div id="map"></div>
    <div class="left-map-tools">
      <button id="homeBtn" title="Home">⌂</button>
      <button id="overlayBtn">OVERLAYS</button>
      <button id="dotBtn">DOTS ON</button>
      <button id="topoBtn">TOPO</button>
      <button id="politicsOverlayBtn">POLITICS</button>
      <button id="refreshBtn">REFRESH</button>
    </div>
    <div id="legend"></div>
    <section id="panel"><button id="panelClose">×</button><h2 id="panelTitle"></h2><div id="panelHeader"></div><div id="panelBody"></div></section>
    <div id="toast"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/renderers.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/v7/console.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
