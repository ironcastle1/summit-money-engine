services:
  - type: web
    name: merlin-cnc
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: merlin-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: MERLIN_DB_PATH
        value: /var/data/merlin.sqlite
      - key: MERLIN_UPLOAD_DIR
        value: /var/data/uploads
      - key: MERLIN_PRODUCT_DIR
        value: /var/data/products
      - key: MERLIN_PREVIEW_DIR
        value: /var/data/previews
      - key: MERLIN_AUTO_RESEARCH
        value: true
      - key: MERLIN_RESEARCH_INTERVAL_HOURS
        value: 12
      - key: MERLIN_RESEARCH_USER_AGENT
        value: MERLIN-CNC-Research/7.0
