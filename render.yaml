services:
  - type: web
    name: merlin-cnc-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: merlin-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MERLIN_DB_PATH
        value: /var/data/merlin.sqlite
      - key: MERLIN_UPLOAD_DIR
        value: /var/data/uploads
      - key: MERLIN_PRODUCT_DIR
        value: /var/data/products
      - key: MERLIN_PREVIEW_DIR
        value: /var/data/previews
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: MERLIN_AUTOMATION_TOKEN
        generateValue: true
      - key: MERLIN_ALLOWED_ORIGINS
        sync: false
