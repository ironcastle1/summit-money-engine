services:
  - type: web
    name: merlin
    runtime: docker
    plan: starter
    healthCheckPath: /api/ops/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4173
      - key: LOG_LEVEL
        value: info
      - key: PUBLIC_ORIGIN
        value: https://summit-money-engine-1.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: ACCOUNT_DATA_FILE
        value: /var/data/accounts.json
    disk:
      name: merlin-runtime-data
      mountPath: /var/data
      sizeGB: 1
