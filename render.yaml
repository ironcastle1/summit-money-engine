services:
  - type: web
    name: merlin-strategic-intelligence
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: merlin-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MERLIN_DATA_DIR
        value: /var/data
      - key: MERLIN_REFRESH_MS
        value: 180000
      - key: MERLIN_SOURCE_TIMEOUT_MS
        value: 9000
