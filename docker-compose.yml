services:
  summit:
    build: .
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      PUBLIC_ORIGIN: http://localhost:4173
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to at least 32 characters}
      ACCOUNT_DATA_FILE: runtime-data/accounts.json
      LOG_LEVEL: info
    volumes:
      - summit-data:/app/runtime-data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  summit-data:
